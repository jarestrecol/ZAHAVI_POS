# Verificacion del recetario en cada envio.
#
# Tres puertas, y las tres tienen que pasar antes de publicar:
#
#   1. `verificar`  la logica y los datos, sin navegador. Segundos.
#   2. `qa`         el navegador de verdad, en escritorio, celular y tableta.
#                   Existe porque hay una familia entera de fallos que la
#                   primera capa no puede ver: el foco que no entra en una
#                   ventana, la hoja que se imprime antes de existir, la barra
#                   que se cree flotante y esta atrapada.
#   3. `build`      construye el artefacto estatico y su carcasa offline.
name: Verificacion

on:
  push:
    branches: [main]
  pull_request:

# El token automatico de Actions solo necesita LEER el codigo. Declararlo
# explicitamente evita que herede permisos de escritura del repositorio el dia
# que se añada un paso que si escriba: un workflow que solo corre pruebas no
# tiene por que poder tocar nada.
permissions:
  contents: read

jobs:
  verificacion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `ci` y no `install`: instala exactamente lo que dice el candado, para
      # que aqui se pruebe lo mismo que en el equipo de quien lo escribio.
      - name: Instalar dependencias de desarrollo
        run: npm ci

      - name: Datos, esquemas y coherencia del CSS
        run: npm run verificar

      # `verificar` todavia no los incluye: el calendario de produccion (PROD-002)
      # y el gasto por periodo (PROD-001) se prueban aqui como pasos propios.
      - name: Calendario de produccion y gasto por periodo
        run: npm run test:calendario && npm run test:informes

      # El panel de inteligencia de negocio del Resumen (BI-001): indicadores,
      # metas y datos de ejemplo, que nunca se escriben en la bodega.
      - name: Indicadores del Resumen y datos de ejemplo
        run: npm run test:bi && npm run test:bi-ejemplo && npm run test:costeo

      # El despliegue actual sirve la fuente, pero el artefacto estatico debe
      # seguir siendo entregable para cualquier alojamiento futuro o recuperacion.
      - name: Construir el artefacto estatico
        run: npm run build

      # Solo Chromium: las pruebas comprueban el reparto de la pantalla y el
      # comportamiento del teclado, no diferencias entre motores.
      - name: Preparar el navegador
        run: npx playwright install --with-deps chromium

      - name: Pruebas de navegador
        run: npm run qa

      - name: Contrato de interfaz remota (servidor simulado)
        run: npx playwright test --config playwright.remoto.config.js --output test-results-remoto

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-qa
          path: playwright-report/
          retention-days: 7

<!doctype html>
<!--
  `translate="no"` NO es una preferencia de idioma: protege los datos.

  El traductor automatico del navegador reescribe el texto que ve, y aqui el
  texto ES el dato. La unidad "und" es ademas "and" en aleman, asi que el
  traductor la detectaba como palabra extranjera dentro de una pagina en
  espanol y la sustituia por "y": en la lista de unidades del editor aparecia
  "y" donde debia decir "und", y lo mismo podia pasarle a un nombre de receta o
  a un ingrediente.

  El valor guardado nunca cambio, era solo lo que se pintaba, pero en una
  pantalla desde la que se pesa una tanda una unidad mal escrita es un error de
  produccion. Se desactiva la traduccion de la pagina entera: la aplicacion esta
  escrita en espanol de principio a fin y traducirla solo puede corromperla.
-->
<html lang="es" translate="no">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` no es un adorno: es lo que hace que `env(safe-area-inset-*)`
      valga algo. Sin el, en un iPhone con el recetario instalado en la pantalla de
      inicio esas variables devuelven 0, y las seis reglas que ya las usan se quedan
      sin el margen que pedian: la barra flotante de acciones y el boton de volver
      (`responsive.css`) y el `--gutter` de los tres tamanos (`tokens.css` y
      `responsive.css`). Es decir, el CSS ya estaba escrito para el recorte de
      pantalla y la plataforma no se lo estaba dando.

      LA ESCALA NO SE TOCA, y es una decision, no un olvido. Anadir
      `maximum-scale=1` o `user-scalable=no` dejaria la interfaz sin poder
      ampliarse con los dedos, y eso incumple el criterio WCAG 2.2 AA 1.4.4, que
      este proyecto declara como objetivo. Lo que se pidio es que NO HAGA FALTA
      pellizcar para ver la aplicacion entera, no que este prohibido: eso se
      arregla quitando el desbordamiento horizontal en el CSS, no atando el zoom.
      Atarlo, ademas, solo esconderia el desbordamiento sin quitarlo.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ZAHAVI POS</title>
    <meta
      name="description"
      content="Recetario de panadería y pastelería. Funciona sin conexión y guarda las recetas en este dispositivo."
    />

    <!--
      Sin conexiones externas: no hay CDN, ni tipografías remotas, ni analítica.
      `connect-src 'self'` cubre el JSON de recetas y la función de publicación.
      Esta política es el respaldo para cuando el sitio se sirve sin cabeceras
      (archivo local o alojamiento estático). En Vercel manda la de `vercel.json`.

      Dice lo mismo que aquella salvo dos directivas, y las dos por un motivo:

      - `frame-ancestors`: el navegador la IGNORA dentro de una meta. Solo existe
        como cabecera, así que aquí sobraría.
      - `upgrade-insecure-requests`: aquí haría daño. Esta meta es justamente el
        respaldo para un alojamiento sin cabeceras, y si ese alojamiento sirviera
        por `http://` la directiva reescribiría todas las peticiones a `https://`
        y el recetario no cargaría ni un módulo. Como cabecera de Vercel sí va,
        porque allí todo es `https` de todos modos.

      `blob:` NO está declarado, y tampoco hace falta: se comprobó ejecutándolo
      contra estas mismas cabeceras. Una descarga por `URL.createObjectURL` +
      `<a download>` (la exportación a CSV) no es una carga de recurso sujeta a
      la CSP, y no genera ninguna violación. Declararlo sería abrir un origen
      para nada. La Web Speech API tampoco pasa por `connect-src`: su tráfico lo
      hace el navegador por dentro, no la página.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1a1714" />

    <!-- Todas las rutas son relativas: el sitio debe funcionar igual servido
      desde una subruta o abierto desde el disco. -->
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <!--
      iOS IGNORA los iconos del manifiesto. Sin este enlace, al añadir el
      recetario a la pantalla de inicio de un iPhone, Safari genera una
      miniatura de la propia página en vez de un icono.
    -->
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="stylesheet" href="./assets/css/fonts.css" />
    <link rel="stylesheet" href="./assets/css/tokens.css" />
    <link rel="stylesheet" href="./assets/css/base.css" />
    <link rel="stylesheet" href="./assets/css/layout.css" />
    <link rel="stylesheet" href="./assets/css/sheet.css" />
    <link rel="stylesheet" href="./assets/css/views.css" />
    <link rel="stylesheet" href="./assets/css/inicio.css" />
    <link rel="stylesheet" href="./assets/css/pantalla.css" />
    <link rel="stylesheet" href="./assets/css/dialogs.css" />
    <link rel="stylesheet" href="./assets/css/almacen.css" />
    <link rel="stylesheet" href="./assets/css/print.css" />
    <!-- Pantalla de fallo del arranque. Comparte hoja con 404.html y 500.html. -->
    <link rel="stylesheet" href="./assets/css/fallback.css" />
    <!-- Al final: ajusta lo anterior segun el tamano de pantalla. -->
    <link rel="stylesheet" href="./assets/css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>

    <!--
      PORTADA DE ARRANQUE. Va escrita aquí, en el HTML, para que se vea en el
      primer pintado sin esperar a que carguen los módulos ES: es lo que enlaza
      con la pantalla de arranque del sistema, que comparte este mismo naranja.

      Está duplicada en src/views/portada.js, que es quien la vuelve a montar
      cuando render() reconstruye #app. Si se cambia una, cámbiese la otra.
    -->
    <div id="app">
      <div class="portada" aria-busy="true">
        <img
          class="portada__logo"
          src="./assets/logo-zahavi.png"
          alt="Zahavi, panadería, repostería y café"
          width="254"
          height="78"
        />
        <p class="portada__estado">Cargando recetario…</p>
      </div>
    </div>

    <!-- Hoja de impresión: se rellena aparte de la maqueta de pantalla. -->
    <div id="print-root" aria-hidden="true"></div>

    <noscript>
      <!--
        Sin estilos dentro del atributo: la politica de seguridad declara
        `style-src 'self'` y un `style="..."` aqui no se aplicaria, asi que el
        aviso se veria como texto suelto sobre el fondo. Reutiliza la pantalla
        de fallo, que es exactamente lo que esto es.
      -->
      <div class="fallo">
        <div class="fallo__inner">
          <p class="fallo__brand">ZAHAVI POS</p>
          <h1 class="fallo__title">Hace falta activar JavaScript</h1>
          <p class="fallo__text">
            Este recetario funciona dentro del navegador, también sin conexión, y para eso necesita
            que JavaScript esté activado.
          </p>
        </div>
      </div>
    </noscript>

    <!--
      Red de seguridad del arranque. Va ANTES del modulo y como script clasico a
      proposito: tiene que estar escuchando cuando `main.js` falle, y tiene que
      poder ejecutarse aunque el navegador no entienda lo que `main.js` usa.
    -->
    <script src="./src/salvavidas.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
